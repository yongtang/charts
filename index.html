<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Charts</title>
<style>
    html,
    body {
        margin: 0;
    }

    body {
        padding: 12px;
    }

    #chart {
        width: 100%;
    }

    .error {
        white-space: pre-wrap;
    }
</style>

<div id="chart"></div>

<script src="https://cdn.jsdelivr.net/npm/vega@6.2.0"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.3"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@7.1.0"></script>

<script type="module">
    function errorText(error) {
        if (!(error instanceof Error)) return String(error);
        if (!error.stack || error.stack.includes(error.message))
            return error.stack ?? error.message;
        return `${error.message}\n${error.stack}`;
    }

    async function load(value, base = location.href) {
        const url = new URL(value, base);

        if (url.pathname.endsWith(".json")) {
            const response = await fetch(url, { cache: "no-store" });
            if (!response.ok) throw new Error(`${response.status} ${response.statusText}: ${url}`);
            return response.json();
        }

        const module = await import(url.href);
        return typeof module.default === "function" ? module.default() : module.default;
    }

    async function main() {
        const page = new URL(location.href);
        const value = page.searchParams.get("url");
        if (!value) throw new Error("Missing url");

        const source = new URL(value, page);
        const spec = await load(source);

        for (const key of ["concat", "hconcat", "vconcat"]) {
            if (!spec[key]) continue;

            spec[key] = await Promise.all(
                spec[key].map((view) => (view?.$ref ? load(view.$ref, source) : view)),
            );
        }

        await vegaEmbed("#chart", spec, {
            actions: false,
            renderer: "canvas",
        });
    }

    main().catch((error) => {
        document.body.classList.add("error");
        document.body.textContent = errorText(error);
    });
</script>
