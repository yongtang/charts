<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Charts</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@__WEB_AWESOME_VERSION__/dist-cdn/styles/themes/default.css"
    />
    <style>
      html,
      body,
      wa-split-panel {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      wa-split-panel {
        --min: 220px;
        --max: 60%;
        --divider-width: 1px;
      }
      #editor {
        display: grid;
        grid-template-rows: auto 1fr auto;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        background: #fafafa;
      }
      #title {
        padding: 10px 14px;
        border-bottom: 1px solid #ddd;
        font-size: 13px;
        font-weight: 600;
      }
      #source {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      #source .cm-editor {
        height: 100%;
      }
      #source .cm-scroller {
        overflow: auto;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      #error {
        padding: 6px 14px;
        border-top: 1px solid #ddd;
        color: #b42318;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        white-space: pre-wrap;
      }
      #error:empty {
        display: none;
      }
      #vis {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "codemirror": "https://esm.sh/codemirror@__CODEMIRROR_VERSION__",
          "csv-parse/sync": "https://cdn.jsdelivr.net/npm/csv-parse@__CSV_PARSE_VERSION__/dist/esm/sync.js",
          "echarts": "https://cdn.jsdelivr.net/npm/echarts@__ECHARTS_VERSION__/dist/echarts.esm.min.js"
        }
      }
    </script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@__WEB_AWESOME_VERSION__/dist-cdn/webawesome.loader.js"
    ></script>
  </head>
  <body>
    <wa-split-panel position-in-pixels="420" primary="start">
      <div id="editor" slot="start">
        <div id="title">Spec</div>
        <div id="source"></div>
        <div id="error" role="status" aria-live="polite"></div>
      </div>
      <div id="vis" slot="end"></div>
    </wa-split-panel>
    <script type="module" src="./src/editor.js"></script>
  </body>
</html>
